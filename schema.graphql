"""Mutation root"""
type Mutation {
  """
  Create or update a system setting (upsert by key) — Requires: ROLE_MANAGE_SYSTEM_SETTING
  """
  saveSystemSetting(dto: SystemSettingDtoInput): Response_SystemSetting

  """Delete report actor | ROLE_DELETE_REPORT_ACTORS"""
  deleteReportActor(uid: String!): Response_ReportActor

  """Invite user by email — Requires: ROLE_MANAGE_USER"""
  inviteUserByEmail(email: String): Response_Boolean
  deleteDistrict(uid: String): Response_District

  """ROLE_MANAGE_BILL"""
  reRequestCancelledBill(billChangeDTO: BillChangeDTOInput!): Response_Bill

  """Update permission details — Requires: ROLE_MANAGE_ROLE"""
  updatePermissionDetails(dto: PermissionDtoInput!): Response_Permission
  seedSubWardFromNAPA: Boolean
  seedSubWardByRegionFromNAPA(id: Long): Boolean

  """Reset Email of phone — Requires: ROLE_VIEW_USER"""
  resetEmailOrPhone(uid: String, infoDto: ChangeUserInfoDtoInput): Response_User
  createOrUpdateWard(dto: WardDtoInput): Response_Ward

  """
  Send a test email to the given address to confirm the mail configuration.
  Returns success or the exact SMTP error. — Requires:
  ROLE_MANAGE_SYSTEM_SETTING
  """
  sendTestEmail(email: String): Response_String
  restoreFieldOfficerSubWard(uid: String): Response_FieldOfficerSubWard

  """
  Activate User | Permission: ROLE_DELETE_USER — Requires: ROLE_DELETE_USER
  """
  activateUser(uid: String): Response_User

  """APPROVE_BILL_CANCELLATION | Approve a bill cancellation request"""
  billCancelApprove(dto: BillCancellationApprovalDTOInput!): Response_BillCancellation

  """Delete farmer | ROLE_MANAGE_FARMER"""
  deleteFarmer(uid: String): Response_Farmer

  """Soft-delete a system setting — Requires: ROLE_DELETE_SYSTEM_SETTING"""
  deleteSystemSetting(uid: String): Response_SystemSetting
  createOrUpdateFieldOfficerSubWard(dto: FieldOfficerSubWardDtoInput): Response_FieldOfficerSubWard

  """Create or update report actor | ROLE_MANAGE_REPORT_ACTORS"""
  createOrUpdateReportActor(input: ReportActorDtoInput!, templateUid: String!): Response_ReportActor

  """ROLE_MANAGE_BILL"""
  billChange(billChangeDTO: BillChangeDTOInput!): Response_Bill

  """Create or update tractor operator | ROLE_MANAGE_TRACTOR_OPERATOR"""
  createOrUpdateTractorOperator(dto: TractorOperatorDtoInput): Response_TractorOperator

  """
  Deleting role | Permissions: ROLE_DELETE_ROLE — Requires: ROLE_DELETE_ROLE
  """
  activateOrDeactivateRole(roleUid: String!): Response_Role

  """Save user — Requires: ROLE_MANAGE_USER"""
  saveUser(userDto: UserDtoInput): Response_User

  """Delete tractor | ROLE_MANAGE_TRACTOR"""
  deleteTractor(uid: String): Response_Tractor
  createOrUpdateDistrict(dto: DistrictDtoInput): Response_District

  """ROLE_DELETE_BILL_ITEM"""
  deleteBillItem(uid: String!): Response_BillItem

  """Delete farm | ROLE_MANAGE_FARM"""
  deleteFarm(uid: String): Response_Farm

  """ROLE_CANCEL_BILL | Request a bill cancellation"""
  billCancelRequest(input: BillCancellationDTOInput!): Response_BillCancellation

  """ROLE_MANAGE_CULTIVATION_PAYMENT"""
  createOrUpdateCultivationPayment(dto: CultivationPaymentDtoInput!): Response_CultivationPayment
  createOrUpdateCultivationSeason(dto: CultivationSeasonDtoInput): Response_CultivationSeason
  seedSubWardByWard(uid: String): Boolean
  restoreSeasonFarmFarmer(uid: String): Response_SeasonFarmFarmer

  """
  Create or update report template — Requires: ROLE_MANAGE_REPORT_TEMPLATE
  """
  saveReportTemplate(input: ReportTemplateDtoInput!): Response_ReportTemplate

  """Delete report recipient | ROLE_DELETE_REPORT_RECIPIENTS"""
  deleteReportRecipient(uid: String!): Response_ReportRecipient

  """Soft-delete a department — Requires: ROLE_DELETE_DEPARTMENT"""
  deleteDepartment(uid: String): Response_Department
  createOrUpdateRegion(dto: RegionDtoInput): Response_Region

  """Assign operator to tractor and preserve assignment history"""
  assignOperatorToTractor(dto: TractorOperatorAssignmentDtoInput): Response_TractorOperatorAssignment

  """ROLE_MANAGE_BILL_PAYMENT"""
  simulatePayment(uid: String!): Response_BillPayment

  """Create or update farm | ROLE_MANAGE_FARM"""
  createOrUpdateFarm(dto: FarmDtoInput): Response_Farm
  deleteCultivationSeason(uid: String): Response_CultivationSeason

  """Reset user password — Requires: ROLE_MANAGE_USER"""
  resetUserPassword(uid: String): Response_User

  """Delete a farm coordinate | ROLE_MANAGE_FARM"""
  deleteFarmCoordinate(uid: String): Response_FarmCoordinate
  seedDistrictFromNAPA: Boolean

  """Create or update a farm coordinate | ROLE_MANAGE_FARM"""
  createOrUpdateFarmCoordinate(dto: FarmCoordinateDtoInput): Response_FarmCoordinate
  seedRegionFromNAPA: Boolean

  """
  Force the in-memory settings cache to clear. Use after editing system_settings
  directly via SQL. Returns the number of entries that were evicted. — Requires:
  ROLE_MANAGE_SYSTEM_SETTING
  """
  flushSystemSettingsCache: Int
  createOrUpdateSeasonZoneRate(dto: SeasonZoneRateDtoInput): Response_SeasonRate
  deleteSeasonZoneRate(uid: String): Response_SeasonRate

  """Create or update report recipient | ROLE_MANAGE_REPORT_RECIPIENTS"""
  createOrUpdateReportRecipient(input: ReportRecipientDtoInput!, templateUid: String!): Response_ReportRecipient
  assignTractorToSeasonFarmFarmer(seasonFarmFarmerUid: String, dto: AssignTractorToSeasonFarmFarmerDtoInput): Response_SeasonFarmFarmer
  seedWardByDistrict(uid: String): Boolean
  seedAllLocationFromNAPA: Boolean

  """Send email"""
  sendEmail(dto: NotificationDtoInput): Boolean!

  """ROLE_DELETE_BILL_CANCELLATION | Delete a bill cancellation"""
  deleteBillCancellation(uid: String!): Response_BillCancellation

  """
  Assigning permissions to a role — Requires: ROLE_ASSIGN_PERMISSIONS_TO_ROLE
  """
  assignPermissionsToRole(roleDto: RoleDtoInput!, roleUid: String!): Response_Role
  deleteSeasonFarmFarmer(uid: String): Response_SeasonFarmFarmer
  createOrUpdateSubWard(dto: SubWardDtoInput): Response_SubWard
  deleteRegion(uid: String): Response_Region

  """
  Assign Roles To User  | Permission: ROLE_ASSIGN_ROLES_TO_USER — Requires: ROLE_ASSIGN_ROLES_TO_USER
  """
  assignRolesToUser(uid: String, userRoleListDto: UserRoleListDtoInput): Response_User
  deleteSubWard(uid: String): Response_SubWard
  seedWardFromNAPA: Boolean
  prepareCultivationBill(seasonFarmFarmerUid: String): Response_SeasonFarmFarmer

  """Create or update tractor | ROLE_MANAGE_TRACTOR"""
  createOrUpdateTractor(dto: TractorDtoInput): Response_Tractor

  """Soft-delete an SMS log — Requires: ROLE_DELETE_SMS_LOG"""
  deleteSmsLog(uid: String): Response_SmsLog

  """Save role — Requires: ROLE_MANAGE_ROLE"""
  saveRole(roleDto: RoleDtoInput!): Response_Role

  """Create or update bill item | ROLE_MANAGE_BILL_ITEM"""
  saveOrUpdateBillItem(input: BillItemDTOInput!, billUid: String!): Response_BillItem

  """Soft-delete a designation — Requires: ROLE_DELETE_DESIGNATION"""
  deleteDesignation(uid: String): Response_Designation
  deleteWard(uid: String): Response_Ward

  """Unlock user — Requires: ROLE_UNLOCK_USER"""
  unlockUser(uid: String): Response_User

  """Create or update a department — Requires: ROLE_MANAGE_DEPARTMENT"""
  saveDepartment(dto: DepartmentDtoInput): Response_Department
  uploadProfilePhoto(attachmentDto: AttachmentDtoInput): Response_Attachment

  """
  Change your own password (self-service). The current password must be
  supplied, so a user can only change their own. — Requires: any signed-in user
  """
  changePassword(uid: String, changePasswordDto: ChangePasswordDtoInput): Response_User

  """ROLE_DELETE_CULTIVATION_PAYMENT"""
  deleteCultivationPayment(uid: String!): Response_CultivationPayment
  deleteFieldOfficerSubWard(uid: String): Response_FieldOfficerSubWard

  """Delete tractor operator | ROLE_MANAGE_TRACTOR_OPERATOR"""
  deleteTractorOperator(uid: String): Response_TractorOperator

  """Create or update a designation — Requires: ROLE_MANAGE_DESIGNATION"""
  saveDesignation(dto: DesignationDtoInput): Response_Designation

  """Create or update farmer | ROLE_MANAGE_FARMER"""
  createOrUpdateFarmer(dto: FarmerDtoInput): Response_Farmer
  createOrUpdateSeasonFarmFarmer(dto: SeasonFarmFarmerDtoInput): Response_SeasonFarmFarmer

  """Close a tractor operator assignment"""
  unassignOperatorFromTractor(assignmentUid: String): Response_TractorOperatorAssignment
  seedDistrictByRegionUid(uid: String): Boolean
  seedCouncilByDistrict(uid: String): Boolean

  """ROLE_MANAGE_BILL"""
  reRequestControlNumber(billChangeDTO: BillChangeDTOInput!): Response_Bill

  """ROLE_MANAGE_BILL"""
  reuseControlNumber(billReUseDTO: BillReUseDTOInput!): Response_Bill
  assignSubWardsToFieldOfficer(dto: FieldOfficerSubWardsDtoInput): Response_FieldOfficerSubWard
