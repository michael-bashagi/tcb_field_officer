  getSeasonFarmFarmersPageable(seasonUid: String, farmUid: String, pageableParam: PageableParamInput, active: Boolean!, farmerUid: String): Page_SeasonFarmFarmer

  """Get users pageable — Requires: ROLE_LOOKUP_USER, ROLE_VIEW_USER"""
  getAllUsersPageable(pageableParam: PageableParamInput, active: Boolean): Page_User

  """
  Get role by Id | Permissions: ROLE_MANAGE_ROLE — Requires: ROLE_MANAGE_ROLE
  """
  getRoleByUid(roleUid: String!): Response_Role

  """Find a designation by uid — Requires: ROLE_VIEW_DESIGNATION"""
  findDesignation(uid: String): Response_Designation

  """View report actor | ROLE_VIEW_REPORT_ACTORS"""
  findReportActor(uid: String!): Response_ReportActor

  """ROLE_PRINT_PAYMENT_RECEIPT"""
  getPaymentReceiptByControlNumber(controlNos: [String]!): Response_String

