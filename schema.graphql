  View report recipients by template | ROLE_LOOKUP_REPORT_RECIPIENTS | ROLE_VIEW_REPORT_RECIPIENTS
  """
  getReportRecipientsByTemplate(pageableParam: PageableParamInput, active: Boolean, templateUid: String!): Page_ReportRecipient

