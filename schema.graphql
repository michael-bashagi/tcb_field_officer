  """
  allReportTemplate: [ReportTemplate]

  """Get current tractor operator assignment"""
  getCurrentOperatorAssignmentByTractor(tractorUid: String): Response_TractorOperatorAssignment

  """Find a farm coordinate by uid | ROLE_VIEW_FARM"""
  findFarmCoordinateByUid(uid: String): Response_FarmCoordinate

  """
  Find a system setting by uid — Requires: ROLE_VIEW_SYSTEM_SETTING, ROLE_MANAGE_SYSTEM_SETTING
  """
  findSystemSetting(uid: String): Response_SystemSetting

