type Query {
  """
  List attachments by source name and ID — Requires: ROLE_LOOKUP_ATTACHMENT, ROLE_VIEW_ATTACHMENT
  """
  listAttachmentsBySourceNameAndId(sourceId: String, sourceName: AttachmentSourceNameEnum): [Attachment]

